<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডিজিটাল প্রোডাক্ট ক্যাটালগ মেকার — by Sojib</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --primary: #059669; --border: #e2e8f0; --text: #0f172a; --muted: #64748b; }
        * { box-sizing: border-box; margin:0; padding:0; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 18px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03); }
        h2 { font-size: 20px; font-weight: 800; color: #047857; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #334155; margin-bottom: 4px; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
        input:focus, textarea:focus { border-color: var(--primary); }
        button { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 14px; }
        .product-item { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .link-box { background: #ecfdf5; border: 1px solid #10b981; color: #065f46; padding: 14px; border-radius: 10px; text-align: center; display: none; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2><i class="ti ti-shopping-cart-plus"></i> ফ্রি প্রোডাক্ট ক্যাটালগ মেকার</h2>
        <p style="font-size:12px; color:var(--muted); margin-bottom:15px;">যাদের কোনো ওয়েবসাইট নেই, এখানে প্রোডাক্ট যুক্ত করে লিংক তৈরি করুন।</p>
        
        <div class="form-group">
            <label>দোকান / ব্যবসার নাম:</label>
            <input type="text" id="storeName" placeholder="যেমন: Diamond Ghor">
        </div>
        <div class="form-group">
            <label>ক্যাটালগ লিংক কোড (ইংরেজি ছোট অক্ষরে):</label>
            <input type="text" id="catalogSlug" placeholder="যেমন: diamondghor বা myshop">
        </div>
    </div>

    <!-- প্রোডাক্ট এন্ট্রি বক্স -->
    <div class="card">
        <h3 style="font-size:15px; font-weight:700; color:#065f46; margin-bottom:10px;">➕ নতুন পণ্য যোগ করুন</h3>
        <div class="form-group">
            <label>পণ্যের নাম:</label>
            <input type="text" id="pName" placeholder="যেমন: T900 Ultra Smart Watch">
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div class="form-group">
                <label>মূল্য (৳ টাকা):</label>
                <input type="number" id="pPrice" placeholder="যেমন: 1250">
            </div>
            <div class="form-group">
                <label>ক্যাটাগরি:</label>
                <input type="text" id="pCategory" placeholder="যেমন: ঘড়ি / টুর্নামেন্ট">
            </div>
        </div>
        <div class="form-group">
            <label>পণ্যের বিবরণ বা নিয়মাবলী:</label>
            <textarea id="pDesc" rows="2" placeholder="যেমন: ওয়াটারপ্রুফ, ৭ দিন ব্যাটারি ব্যাকআপ।"></textarea>
        </div>
        <button type="button" onclick="addProductToList()" style="background:#0284c7;">
            <i class="ti ti-plus"></i> তালিকায় পণ্যটি যোগ করুন
        </button>
    </div>

    <!-- যুক্ত হওয়া পণ্যের তালিকা -->
    <div class="card">
        <h3 style="font-size:15px; font-weight:700; color:#065f46; margin-bottom:10px;">📦 যোগ করা পণ্যের তালিকা (<span id="pCount">0</span>টি)</h3>
        <div id="productList">
            <div style="font-size:12px; color:var(--muted); text-align:center;">এখনো কোনো পণ্য যোগ করা হয়নি।</div>
        </div>
        
        <button type="button" onclick="saveAndGenerateLink()" style="margin-top:15px; background:#059669; font-size:15px;">
            <i class="ti ti-link"></i> ফাইনাল ক্যাটালগ লিংক তৈরি করুন
        </button>

        <div id="linkOutput" class="link-box">
            <b>🎉 আপনার ক্যাটালগ লিংক তৈরি হয়েছে!</b><br>
            <input type="text" id="finalUrlText" readonly style="margin:10px 0; text-align:center; font-weight:700; background:#fff; color:#059669;">
            <button onclick="copyCatalogLink()" style="background:#059669; padding:8px;"><i class="ti ti-copy"></i> লিংক কপি করুন</button>
            <p style="font-size:11px; margin-top:8px;">বট তৈরির সময় ড্রপডাউনে এই লিংকটি পেস্ট করে দেবেন!</p>
        </div>
    </div>
</div>

<script>
    let products = [];

    function addProductToList() {
        const name = document.getElementById('pName').value.trim();
        const price = document.getElementById('pPrice').value.trim();
        const category = document.getElementById('pCategory').value.trim() || 'General';
        const desc = document.getElementById('pDesc').value.trim();

        if (!name || !price) return alert('পণ্যের নাম এবং দাম দিতে হবে!');

        products.push({ name, price: parseFloat(price), category, description: desc });
        renderList();

        document.getElementById('pName').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pDesc').value = '';
    }

    function renderList() {
        document.getElementById('pCount').innerText = products.length;
        const container = document.getElementById('productList');
        if (products.length === 0) {
            container.innerHTML = '<div style="font-size:12px; color:var(--muted); text-align:center;">এখনো কোনো পণ্য যোগ করা হয়নি।</div>';
            return;
        }
        container.innerHTML = products.map((p, idx) => `
            <div class="product-item">
                <div>
                    <b>${p.name}</b> — ৳${p.price}<br>
                    <small style="color:#64748b;">${p.category} | ${p.description || 'বিবরণ নেই'}</small>
                </div>
                <button onclick="removeProduct(${idx})" style="width:auto; padding:4px 8px; background:#fee2e2; color:#b91c1c;">ডিলিট</button>
            </div>
        `).join('');
    }

    function removeProduct(idx) {
        products.splice(idx, 1);
        renderList();
    }

    async function saveAndGenerateLink() {
        const storeName = document.getElementById('storeName').value.trim();
        let slug = document.getElementById('catalogSlug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');

        if (!storeName) return alert('দোকানের নাম দিন!');
        if (!slug) slug = 'cat_' + Math.floor(1000 + Math.random() * 9000);
        if (products.length === 0) return alert('কমপক্ষে ১টি পণ্য যোগ করুন!');

        try {
            const res = await fetch('/api/catalog/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ store_name: storeName, catalog_slug: slug, items: products })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('linkOutput').style.display = 'block';
                document.getElementById('finalUrlText').value = data.catalog_url;
            } else {
                alert('ত্রুটি: ' + data.message);
            }
        } catch(e) {
            alert('সার্ভার কানেকশন সমস্যা!');
        }
    }

    function copyCatalogLink() {
        const copyText = document.getElementById('finalUrlText');
        copyText.select();
        document.execCommand('copy');
        alert('ক্যাটালগ লিংক কপি করা হয়েছে!');
    }
</script>
</body>
</html>
