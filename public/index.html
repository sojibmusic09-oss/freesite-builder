<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Your AI WhatsApp Bot Dashboard — FreeSite Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root { --primary: #38bdf8; --bg: #09090b; --card: #18181b; --border: #27272a; --text: #fafafa; }
        * { box-sizing: border-box; margin:0; padding:0; font-family: 'Hind Siliguri', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.15), transparent 40%);
        }
        .setup-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
        }
        h2 { font-size: 22px; color: var(--primary); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        p { font-size: 14px; color: #a1a1aa; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 6px; }
        input, select {
            width: 100%;
            padding: 13px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--primary); }
        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        button:hover { background: #1d4ed8; }
        .success-box {
            background: #064e3b;
            border: 1px solid #059669;
            color: #a7f3d0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="setup-card">
    <h2><i class="ti ti-robot"></i> AI WhatsApp Bot ক্রিয়েটর</h2>
    <p>আপনার ব্যবসার নাম এবং ওয়েবসাইটের লিংক দিন। এআই আপনার পুরো সাইট অ্যানালাইসিস করে স্বয়ংক্রিয়ভাবে আপনার নিজস্ব ড্যাশবোর্ড তৈরি করে দেবে।</p>

    <form onsubmit="handleLaunch(event)">
        <div class="form-group">
            <label>আপনার ব্যবসার নাম / শপের নাম:</label>
            <input type="text" id="bizName" required placeholder="যেমন: Sojib Gadget Store">
        </div>

        <div class="form-group">
            <label>আপনার ওয়েবসাইটের লিংক (যা এআই অ্যানালাইসিস করবে):</label>
            <input type="url" id="siteUrl" required placeholder="https://mywebsite.com">
        </div>

        <div class="form-group">
            <label>আপনার পছন্দের সাবডোমেইন নাম:</label>
            <input type="text" id="subdomain" required placeholder="যেমন: sojib, gadget, shop">
        </div>

        <div class="form-group">
            <label>মূল ডোমেইন নির্বাচন করুন:</label>
            <select id="baseDomain">
                <option value="sojib.de5.net">sojib.de5.net</option>
                <option value="sojib.qd.je">sojib.qd.je</option>
                <option value="sojub.cc.cd">sojub.cc.cd</option>
            </select>
        </div>

        <button type="submit" id="btnSubmit"><i class="ti ti-rocket"></i> আমার AI ড্যাশবোর্ড তৈরি করুন</button>
    </form>

    <div id="resultBox" class="success-box"></div>
</div>

<script>
    async function handleLaunch(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.innerText = 'এআই আপনার ওয়েবসাইট বিশ্লেষণ করছে... অপেক্ষা করুন';
        btn.disabled = true;

        const data = {
            bot_name: document.getElementById('bizName').value,
            website_url: document.getElementById('siteUrl').value,
            subdomain: document.getElementById('subdomain').value,
            base_domain: document.getElementById('baseDomain').value
        };

        try {
            const res = await fetch('/api/launch-bot-dashboard', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            const box = document.getElementById('resultBox');
            box.style.display = 'block';

            if (result.success) {
                box.innerHTML = `
                    <h4>🎉 ড্যাশবোর্ড সফলভাবে তৈরি হয়েছে!</h4>
                    <p style="margin:8px 0;">আপনার ওয়েবসাইট অ্যানালাইসিস সম্পন্ন হয়েছে।</p>
                    <a href="${result.dashboardUrl}" target="_blank" style="color:#fff; font-weight:700; text-decoration:underline;">
                        আপনার নিজস্ব ড্যাশবোর্ডে প্রবেশ করুন 👉 ${result.dashboardUrl}
                    </a>
                `;
            } else {
                box.style.background = '#7f1d1d';
                box.style.color = '#fecaca';
                box.innerText = result.message || 'ত্রুটি ঘটেছে!';
            }
        } catch (err) {
            alert('কানেকশন সমস্যা হয়েছে!');
        } finally {
            btn.innerHTML = '<i class="ti ti-rocket"></i> আমার AI ড্যাশবোর্ড তৈরি করুন';
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
