<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Your AI WhatsApp Bot — FreeSite Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root { --primary: #38bdf8; --bg: #09090b; --card: #18181b; --border: #27272a; --text: #fafafa; }
        * { box-sizing: border-box; margin:0; padding:0; font-family: 'Hind Siliguri', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.12), transparent 40%);
        }
        .setup-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 26px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
        }
        h2 { font-size: 22px; color: var(--primary); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        p { font-size: 13px; color: #a1a1aa; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 6px; font-weight: 600; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        button:hover { background: #1d4ed8; }
        .success-box {
            background: #064e3b;
            border: 1px solid #059669;
            color: #a7f3d0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="setup-card">
    <h2><i class="ti ti-robot"></i> AI WhatsApp Bot ক্রিয়েটর</h2>
    <p>ব্যক্তিগত চ্যাটিং বা শপের সেলস—আপনার প্রয়োজন অনুযায়ী এআই বট তৈরি করুন।</p>

    <form onsubmit="handleLaunch(event)">
        <!-- ড্রপডাউন: বটের ধরন নির্বাচন -->
        <div class="form-group">
            <label>বটের ধরন নির্বাচন করুন (Bot Type):</label>
            <select id="botType" onchange="toggleBotFields()">
                <option value="business_site">🛍️ ই-কমার্স শপ (ওয়েবসাইট লিংক আছে)</option>
                <option value="business_no_site">🏬 সাধারণ ব্যবসা / শপ (ওয়েবসাইট নেই)</option>
                <option value="personal">👤 পার্সোনাল ইউজার (ব্যক্তিগত AI সহকারী)</option>
            </select>
        </div>

        <div class="form-group">
            <label id="lblBizName">আপনার নাম বা ব্যবসার নাম:</label>
            <input type="text" id="bizName" required placeholder="যেমন: Sojib Store অথবা Sojib Ahmed">
        </div>

        <!-- ১. ওয়েবসাইট ফিল্ড (শুধু যাদের ওয়েবসাইট আছে) -->
        <div class="form-group" id="siteUrlGroup">
            <label>ওয়েবসাইট লিংক (যা এআই রিড করবে):</label>
            <input type="url" id="siteUrl" placeholder="https://mywebsite.com">
        </div>

        <!-- ২. নো-ওয়েবসাইট ফিল্ড (পণ্য বা সাধারণ নির্দেশনা) -->
        <div class="form-group" id="manualDetailsGroup" style="display:none;">
            <label id="lblManualDetails">ব্যবসার পণ্য বা নিয়মাবলী লিখে দিন:</label>
            <textarea id="manualDetails" rows="3" placeholder="যেমন: আমাদের দোকানে ঘড়ি ও হেডফোন পাওয়া যায়। ডেলিভারি চার্জ ৭০ টাকা।"></textarea>
        </div>

        <!-- সাবডোমেইন সেকশন -->
        <div class="form-group">
            <label>আপনার ড্যাশবোর্ডের সাবডোমেইন নাম:</label>
            <input type="text" id="subdomain" required placeholder="যেমন: sojib, mybot, shop">
        </div>

        <div class="form-group">
            <label>মূল ডোমেইন নির্বাচন করুন:</label>
            <select id="baseDomain">
                <option value="sojib.de5.net">sojib.de5.net</option>
                <option value="sojib.qd.je">sojib.qd.je</option>
                <option value="sojub.cc.cd">sojub.cc.cd</option>
            </select>
        </div>

        <button type="submit" id="btnSubmit"><i class="ti ti-rocket"></i> আমার AI ড্যাশবোর্ড তৈরি করুন</button>
    </form>

    <div id="resultBox" class="success-box"></div>
</div>

<script>
    function toggleBotFields() {
        const type = document.getElementById('botType').value;
        const siteGrp = document.getElementById('siteUrlGroup');
        const manualGrp = document.getElementById('manualDetailsGroup');
        const lblBiz = document.getElementById('lblBizName');
        const lblManual = document.getElementById('lblManualDetails');

        if (type === 'business_site') {
            siteGrp.style.display = 'block';
            manualGrp.style.display = 'none';
            lblBiz.innerText = 'আপনার ব্যবসার নাম / শপের নাম:';
        } else if (type === 'business_no_site') {
            siteGrp.style.display = 'none';
            manualGrp.style.display = 'block';
            lblBiz.innerText = 'দোকান / ব্যবসার নাম:';
            lblManual.innerText = 'পণ্য ও ডেলিভারি তথ্য লিখে দিন:';
        } else if (type === 'personal') {
            siteGrp.style.display = 'none';
            manualGrp.style.display = 'block';
            lblBiz.innerText = 'আপনার নিজের নাম (Your Name):';
            lblManual.innerText = 'আপনার সম্পর্কে কিছু বলুন (এআই কী বলবে):';
            document.getElementById('manualDetails').placeholder = 'যেমন: আমি একজন ডেভেলপার। কেউ মেসেজ দিলে বলবে ভাইয়া ব্যস্ত আছেন, জরুরি হলে কল দিতে বলুন।';
        }
    }

    async function handleLaunch(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.innerText = 'তৈরি হচ্ছে... দয়া করে অপেক্ষা করুন';
        btn.disabled = true;

        const data = {
            bot_type: document.getElementById('botType').value,
            bot_name: document.getElementById('bizName').value,
            website_url: document.getElementById('siteUrl').value,
            custom_info: document.getElementById('manualDetails').value,
            subdomain: document.getElementById('subdomain').value,
            base_domain: document.getElementById('baseDomain').value
        };

        try {
            const res = await fetch('/api/launch-bot-dashboard', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            const box = document.getElementById('resultBox');
            box.style.display = 'block';

            if (result.success) {
                box.innerHTML = `
                    <h4>🎉 ড্যাশবোর্ড সফলভাবে তৈরি হয়েছে!</h4>
                    <a href="${result.dashboardUrl}" target="_blank" style="color:#fff; font-weight:700; text-decoration:underline; display:inline-block; margin-top:8px;">
                        আপনার ড্যাশবোর্ডে প্রবেশ করুন 👉 ${result.dashboardUrl}
                    </a>
                `;
            } else {
                box.style.background = '#7f1d1d';
                box.style.color = '#fecaca';
                box.innerText = result.message || 'ত্রুটি ঘটেছে!';
            }
        } catch (err) {
            alert('কানেকশন সমস্যা হয়েছে!');
        } finally {
            btn.innerHTML = '<i class="ti ti-rocket"></i> আমার AI ড্যাশবোর্ড তৈরি করুন';
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
