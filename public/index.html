<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI WhatsApp Bot Platform — by Sojib</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
    :root {
      --primary: ${primaryColor};
      --primary-rgb: 5, 150, 105;
      --bg: #f1f5f9;
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-bg-subtle: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-border-subtle: rgba(226, 232, 240, 0.65);
      --glass-shadow: 0 10px 32px 0 rgba(31, 38, 135, 0.06);
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin:0; padding:0; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; }
    
    /* 🌟 সফট গ্রিড ও গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড যা গ্লাস এফেক্টকে ফুটিয়ে তুলবে */
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(14, 165, 233, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(99, 102, 241, 0.06) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      padding: 20px 15px;
      min-height: 100vh;
    }
    .container { max-width: 880px; margin: 0 auto; }
    
    /* 💎 হেডার গ্লাস স্টাইল */
    .header {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 22px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      box-shadow: var(--glass-shadow);
    }
    .brand-title { font-size: 21px; font-weight: 800; color: #047857; display: flex; align-items: center; gap: 10px; }
    
    /* স্ট্যাটাস ব্যাজ */
    .status-badge {
      font-size: 12px; font-weight: 700; padding: 7px 16px; border-radius: 30px;
      backdrop-filter: blur(8px);
    }
    .status-badge.connected {
      background: rgba(220, 252, 231, 0.85);
      color: #15803d;
      border: 1px solid rgba(187, 247, 208, 0.9);
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.12);
    }
    .status-badge.disconnected {
      background: rgba(254, 226, 226, 0.85);
      color: #b91c1c;
      border: 1px solid rgba(254, 202, 202, 0.9);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.12);
    }

    /* 💎 প্রধান সব কার্ডের প্রফেশনাল ফ্রস্টেড গ্লাস ডিজাইন */
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: var(--glass-shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      box-shadow: 0 14px 40px 0 rgba(31, 38, 135, 0.09);
    }
    .card h3 {
      font-size: 16px; font-weight: 800; color: #065f46;
      display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
    }

    /* 📊 স্ট্যাটাস গ্রিড কার্ডসমূহ */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .stat-box {
      background: var(--glass-bg-subtle);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      padding: 18px 16px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
      transition: 0.2s;
    }
    .stat-box:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-2px);
    }
    .stat-val { font-size: 26px; font-weight: 800; color: #059669; margin-top: 4px; }
    .stat-lbl { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

    /* 📝 ফর্ম ইনপুট ফিল্ডস (Semi-transparent Glassy Input) */
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #334155; margin-bottom: 7px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border-subtle);
      border-radius: 12px;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.015);
    }
    input:focus, select:focus, textarea:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15), inset 0 2px 4px rgba(0,0,0,0.01);
    }

    /* 🚀 মডার্ন থ্রিডি শাইন বাটন */
    button {
      width: 100%;
      padding: 13px 18px;
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      box-shadow: 0 6px 18px -2px rgba(5, 150, 105, 0.35);
      transition: all 0.2s ease;
    }
    button:hover {
      background: linear-gradient(135deg, #047857 0%, #065f46 100%);
      box-shadow: 0 8px 24px -2px rgba(5, 150, 105, 0.45);
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(1px);
    }

    /* পেয়ারিং কোড বক্স */
    .code-box {
      background: rgba(240, 253, 244, 0.85);
      backdrop-filter: blur(10px);
      border: 2px dashed #059669;
      padding: 18px;
      border-radius: 16px;
      text-align: center;
      margin-top: 15px;
      display: none;
    }
    .code-val { font-size: 30px; font-weight: 800; letter-spacing: 6px; color: #047857; font-family: monospace; }

    /* টার্মিনাল লগ বক্স (সফট ডার্ক ব্লার) */
    .terminal-window {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 16px;
      height: 180px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      color: #f8fafc;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
    }
    .log-line { margin-bottom: 6px; }

    /* পেমেন্ট বক্স */
    .payment-box {
      background: var(--glass-bg-subtle);
      border: 1px solid var(--glass-border-subtle);
      border-radius: 14px;
      padding: 18px;
      margin-top: 14px;
    }
    .pay-methods { display: flex; gap: 10px; margin-bottom: 14px; }
    .pay-badge {
      flex: 1; text-align: center; padding: 10px; border-radius: 10px;
      font-size: 13px; font-weight: 700;
      border: 1px solid var(--glass-border-subtle);
      cursor: pointer;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(6px);
      transition: 0.2s;
    }
    .pay-badge.active {
      background: rgba(236, 253, 245, 0.9);
      border-color: #059669;
      color: #059669;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.15);
    }

    .color-dot {
      width: 32px; height: 32px; border-radius: 50%;
      cursor: pointer; border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .color-dot:hover { transform: scale(1.15); }
    .color-picker { display: flex; gap: 12px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="setup-card">
    <div class="brand-header">
        <div class="wa-logo"><i class="ti ti-brand-whatsapp"></i></div>
        <h2>AI WhatsApp Bot ক্রিয়েটর</h2>
        <p>ব্যক্তিগত চ্যাট বা শপের সেলস—১ ক্লিকে আপনার নিজস্ব ড্যাশবোর্ড তৈরি করুন</p>
    </div>

    <form onsubmit="handleLaunch(event)">
        <div class="form-group">
            <label>বটের ধরন নির্বাচন করুন (Bot Type):</label>
            <select id="botType" onchange="toggleBotFields()">
                <option value="catalog_link">📦 ওয়েবসাইট নেই (ক্যাটালগ লিংক দিয়ে বট বানাবো)</option>
                <option value="business_site">🌐 আমার ওয়েবসাইট আছে (Website URL)</option>
                <option value="personal">👤 পার্সোনাল ইউজার (ব্যক্তিগত AI সহকারী)</option>
            </select>
        </div>

        <!-- ক্যাটালগ লিংক ইনপুট বক্স -->
        <div class="form-group" id="catalogUrlGroup">
            <label>আপনার ক্যাটালগ লিংক পেস্ট করুন:</label>
            <input type="text" id="catalogUrl" placeholder="যেমন: https://.../catalog/diamondghor">
            <small style="display:block; margin-top:5px; color:#059669; font-weight:700;">
              👉 ক্যাটালগ লিংক নেই? <a href="/catalog-builder" target="_blank" style="text-decoration:underline; color:#059669;">এখানে ক্লিক করে ২ মিনিটে পণ্য যোগ করে লিংক বানিয়ে নিন!</a>
            </small>
        </div>

        <div class="form-group">
            <label id="lblBizName">আপনার নাম বা ব্যবসার নাম:</label>
            <input type="text" id="bizName" required placeholder="যেমন: Diamond Ghor">
        </div>

        <div class="form-group" id="siteUrlGroup">
            <label>ওয়েবসাইট লিংক (যা এআই রিড করবে):</label>
            <input type="url" id="siteUrl" placeholder="https://mywebsite.com">
        </div>

        <div class="form-group" id="manualDetailsGroup" style="display:none;">
            <label id="lblManualDetails">পণ্য বা নিয়মাবলী লিখে দিন:</label>
            <textarea id="manualDetails" rows="3" placeholder="যেমন: আমাদের দোকানে ঘড়ি ও গ্যাজেট পাওয়া যায়।"></textarea>
        </div>

        <div class="form-group">
            <label>সাবডোমেইন নাম:</label>
            <input type="text" id="subdomain" required placeholder="যেমন: daimondghor, shop, sojib">
        </div>

        <div class="form-group">
            <label>মূল ডোমেইন:</label>
            <select id="baseDomain">
                <option value="sojib.de5.net">sojib.de5.net</option>
                <option value="sojub.cc.cd">sojub.cc.cd</option>
            </select>
        </div>

        <button type="submit" id="btnSubmit"><i class="ti ti-rocket"></i> আমার AI ড্যাশবোর্ড তৈরি করুন</button>
    </form>

    <div id="resultBox" class="success-box"></div>

    <div class="creator-badge">
        <span>Architect: <b>Sojib</b></span>
        <a href="https://wa.me/8801409084819" target="_blank"><i class="ti ti-brand-whatsapp"></i> 01409084819</a>
        <a href="https://tiktok.com/@sojib..music" target="_blank"><i class="ti ti-brand-tiktok"></i> @sojib..music</a>
    </div>
</div>

<script>
    function toggleBotFields() {
        const type = document.getElementById('botType').value;
        const siteGrp = document.getElementById('siteUrlGroup');
        const manualGrp = document.getElementById('manualDetailsGroup');
        const catGrp = document.getElementById('catalogUrlGroup');
        const lblBiz = document.getElementById('lblBizName');

        // সব ফিল্ড ডিফল্টভাবে লুকান
        siteGrp.style.display = 'none';
        manualGrp.style.display = 'none';
        catGrp.style.display = 'none';

        if (type === 'catalog_link') {
            catGrp.style.display = 'block';
            lblBiz.innerText = 'দোকান / ব্যবসার নাম:';
        } else if (type === 'business_site') {
            siteGrp.style.display = 'block';
            lblBiz.innerText = 'ব্যবসার নাম / শপের নাম:';
        } else if (type === 'personal') {
            manualGrp.style.display = 'block';
            lblBiz.innerText = 'আপনার নিজের নাম (Your Name):';
            document.getElementById('manualDetails').placeholder = 'যেমন: আমি ব্যস্ত থাকলে বন্ধুদের বলবে পরে কল দিতে।';
        }
    }

    async function handleLaunch(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.innerText = 'তৈরি হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন';
        btn.disabled = true;

        const data = {
            bot_type: document.getElementById('botType').value,
            bot_name: document.getElementById('bizName').value,
            website_url: document.getElementById('siteUrl').value,
            catalog_url: document.getElementById('catalogUrl') ? document.getElementById('catalogUrl').value.trim() : '',
            custom_info: document.getElementById('manualDetails').value,
            subdomain: document.getElementById('subdomain').value,
            base_domain: document.getElementById('baseDomain').value
        };

        try {
            const res = await fetch('/api/launch-bot-dashboard', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            const box = document.getElementById('resultBox');
            box.style.display = 'block';

            if (result.success) {
                box.innerHTML = `
                    <h4>🎉 ড্যাশবোর্ড সফলভাবে তৈরি হয়েছে!</h4>
                    <a href="${result.dashboardUrl}" target="_blank" style="color:#047857; font-weight:800; text-decoration:underline; display:inline-block; margin-top:8px;">
                        আপনার ড্যাশবোর্ডে প্রবেশ করুন 👉 ${result.dashboardUrl}
                    </a>
                `;
            } else {
                box.style.background = '#fee2e2';
                box.style.color = '#991b1b';
                box.innerText = result.message || 'ত্রুটি ঘটেছে!';
            }
        } catch (err) {
            alert('কানেকশন সমস্যা হয়েছে!');
        } finally {
            btn.innerHTML = '<i class="ti ti-rocket"></i> আমার AI ড্যাশবোর্ড তৈরি করুন';
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
